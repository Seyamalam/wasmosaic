<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Threshold differential</title>
    <script type="importmap">
      { "imports": { "#wasm": "/wasm/wasmosaic_wasm.js" } }
    </script>
  </head>
  <body>
    <h1>Threshold differential</h1>
    <output id="result">Running...</output>
    <script type="module">
      import { initOpenCv } from "/dist/index.js";
      import { runThresholdCases } from "./threshold-cases.js";
      import { compareResize } from "./resize-cases.js";
      const output = document.getElementById("result");
      const worker = new Worker("./threshold-worker.js");
      const timer = setTimeout(() => {
        worker.terminate();
        output.textContent = "FAIL timeout";
      }, 180000);
      worker.addEventListener("message", async ({ data }) => {
        clearTimeout(timer);
        try {
          if (data.error) throw new Error(data.error);
          const cv = await initOpenCv();
          globalThis.thresholdActual = runThresholdCases(cv, false);
          globalThis.thresholdReference = data.result;
          globalThis.thresholdReport = compareResize(thresholdActual, data.result);
          output.textContent = `DONE ${thresholdReport.cases} cases, ${thresholdReport.differences.length} differences`;
        } catch (error) {
          output.textContent = `FAIL ${error.stack ?? error}`;
        } finally {
          worker.terminate();
        }
      });
      worker.addEventListener("error", (event) => {
        clearTimeout(timer);
        worker.terminate();
        output.textContent = `FAIL ${event.message}`;
      });
      worker.postMessage({});
    </script>
  </body>
</html>
